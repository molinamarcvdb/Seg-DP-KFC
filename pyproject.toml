[project]
name = "seg-dp-kfc"
version = "0.1.0"
description = "Segmentation Networks with Differential Privacy for Retinal Vessel Segmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "opacus>=1.4.0", # Differential privacy for PyTorch
    "albumentations>=1.3.0", # Data augmentation
    "tensorboard>=2.14.0",
    "pyyaml>=6.0",
    "medmnist>=3.0.0", # MedMNIST datasets
    "noise>=1.2.2", # Perlin noise generation
    "scipy>=1.11.0", # Scientific computing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
